name: Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v3
    - name: Install dependencies
      run: uv sync
    - name: Lint
      run: make lint
    - name: Typecheck
      run: make typecheck
    - name: Test with pytest
      run: make coverage
