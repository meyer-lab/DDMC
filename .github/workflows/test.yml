name: Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check ddmc
      - name: Check formatting with ruff
        run: uv run ruff format --check ddmc
      - name: Type check with ty
        run: uv run ty check ddmc
      - name: Test with pytest
        run: uv run pytest --cov=ddmc --cov-report=term
