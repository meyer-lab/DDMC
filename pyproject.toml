[project]
name = "ddmc"
version = "0.1.0"
description = ""
authors = [{ name = "Aaron Meyer", email = "git@asmlab.org" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.16",
    "matplotlib>=3.10",
    "seaborn>=0.13.2",
    "svgutils>=0.3.4",
    "pandas>=3",
    "panflute>=2.3.1",
    "biopython>=1.85",
    "scikit-learn>=1.5",
    "bioinfokit>=2.1.4",
    "statsmodels>=0.14.4",
    "fancyimpute>=0.7.0",
    "mygene>=3.2.2",
    "logomaker>=0.8.6",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<10.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.15",
    "ty>=0.0.1a0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
fbuild = "ddmc.figures.common:genFigure"

[tool.hatch.build.targets.wheel]
packages = ["ddmc"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
