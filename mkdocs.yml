site_name: DDMC
site_description: Dual data and motif clustering for phosphoproteomic data
repo_url: https://github.com/meyer-lab/DDMC
repo_name: meyer-lab/DDMC
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Tutorials:
      - Clustering CPTAC lung cancer data: tutorials/cptac_clustering.md
      - Clustering a kinase-inhibitor dataset: tutorials/ebdt_clustering.md
  - API reference:
      - DDMC: reference/clustering.md
      - Datasets: reference/datasets.md
      - Motifs: reference/motifs.md
      - Sequence distances: reference/distances.md
      - Logistic regression: reference/logistic_regression.md
      - Figure plotting helpers: reference/figures_common.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
